<!doctype html><html lang="es"><meta charset="utf-8"><title>Editor de textos · Rock & Casta</title>
<style>body{font:16px system-ui;background:#111a24;color:#eef;max-width:1100px;margin:25px auto;padding:20px}button,input,select,textarea{font:inherit;background:#223448;color:#fff;border:1px solid #68809b;border-radius:5px;padding:7px}button{cursor:pointer}textarea{width:100%;box-sizing:border-box;min-height:70px;font-family:Consolas,monospace}.row{background:#1b2938;padding:14px;margin:12px 0;border-radius:8px}.meta{color:#afc2d4;font-size:13px}.bad{outline:2px solid #ff6b6b}#status{position:sticky;bottom:0;background:#0a1119;padding:12px;color:#9fe2b1}</style>
<h1>Editor de textos</h1><p>Selecciona <b>textos.json</b>, modifica las cadenas y descarga el fichero editado. Admite Ñ y vocales acentuadas; el importador recoloca el banco si una traducción crece.</p>
<input id="file" type="file" accept=".json"><select id="section"><option value="">Todas las secciones</option></select><input id="search" placeholder="Buscar"><button id="save" disabled>Descargar textos_editados.json</button>
<main id="rows"></main><div id="status">Esperando textos.json</div>
<script>
const $=x=>document.getElementById(x);let doc=null;
function validate(row,value,area){const lines=value.replace(/\r/g,'').split('\n'),allowed=/^[\x20-\x7eÑñÁáÉéÍíÓóÚú]*$/;let error=lines.length!==row.max_line_chars.length;if(!error)error=lines.some((x,i)=>!allowed.test(x)||[...x].length>row.max_line_chars[i]);area.classList.toggle('bad',error);return !error}
function render(){if(!doc)return;const sec=$('section').value,q=$('search').value.toUpperCase();$('rows').replaceChildren();let shown=0;for(const row of doc.strings){if(sec&&row.section!==sec)continue;if(q&&!row.text.toUpperCase().includes(q)&&!row.id.includes(q))continue;shown++;const box=document.createElement('div');box.className='row';const meta=document.createElement('div');meta.className='meta';meta.textContent=`${row.id} · ${row.section} · origen 0x${row.offset.toString(16).toUpperCase().padStart(6,'0')} · máximos ${row.max_line_chars.join('/')}`;const area=document.createElement('textarea');area.value=row.text;area.rows=Math.max(2,row.line_widths.length+1);area.oninput=()=>{row.text=area.value;validate(row,row.text,area);count()};box.append(meta,area);$('rows').append(box)}count();$('status').textContent+=` · ${shown} visibles`}
function count(){if(!doc)return;const invalid=[...document.querySelectorAll('textarea.bad')].length;$('save').disabled=invalid>0;$('status').textContent=`${doc.strings.length} cadenas cargadas · ${invalid} inválidas`}
$('file').onchange=async()=>{try{doc=JSON.parse(await $('file').files[0].text());if(doc.format!=='Charnego Rock & Casta text v2'||!Array.isArray(doc.strings))throw Error('Formato no reconocido');const sections=[...new Set(doc.strings.map(x=>x.section))];$('section').replaceChildren(new Option('Todas las secciones',''),...sections.map(x=>new Option(x,x)));render()}catch(e){doc=null;$('status').textContent=e.message}};
$('section').onchange=render;$('search').oninput=render;
$('save').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(doc,null,2)],{type:'application/json'}));a.download='textos_editados.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
</script></html>
